<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` plus `user-scalable=no`: portals embed the game in an
      iframe where a pinch-zoom is almost always an accidental double-tap on a
      buy button, and the resulting zoom cannot be undone from inside the frame.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Both are replaced at boot by the detected locale; see `setLocale`. -->
    <meta name="description" content="모래알 하나를 은하로 키우는 방치형 게임." />
    <meta name="theme-color" content="#0e0d13" />
    <title>돌멩이 키우기</title>
    <!-- Inline so the page makes no second request; portals score cold loads. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e0d13'/%3E%3Ccircle cx='16' cy='17' r='8' fill='%23a89b84'/%3E%3Ccircle cx='13' cy='14' r='2.4' fill='%23cfc4ad'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
