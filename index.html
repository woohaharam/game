<meta

<meta property="og:title" content="Neon Depths" />
<meta
  property="og:description"
  content="A browser action roguelike built from scratch in TypeScript."
/>
<meta property="og:type" content="website" />

<style>
  :root {
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #05060d;
    /* The canvas owns every gesture; the page must never scroll or zoom
       under the player's thumb mid-dodge. */
    overscroll-behavior: none;
    touch-action: none;
    font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
  }

  #game {
    display: block;
    width: 100vw;
    height: 100dvh;
    /* Pixel-art-adjacent crispness when the letterbox scale is non-integer. */
    image-rendering: optimizeQuality;
    cursor: crosshair;
    touch-action: none;
  }

  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 14px;
    justify-items: center;
    color: #7f93ad;
    letter-spacing: 6px;
    font-size: 13px;
    background: #05060d;
  }

  #boot .mark {
    width: 34px;
    height: 34px;
    border: 2px solid #4cc9ff;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #boot .mark {
      animation-duration: 3s;
    }
  }

  /* The arena is authored landscape; in portrait the letterbox squeezes the
     game into an unplayable strip. Touch devices get a rotate prompt instead,
     and the loop is stopped behind it. Desktop is never affected — the media
     query requires a coarse pointer. */
  #rotate {
    display: none;
  }

  @media (orientation: portrait) and (pointer: coarse) {
    #rotate {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 20px;
      padding: 32px;
      text-align: center;
      background: #05060d;
      color: #e8f4ff;
    }

    #rotate .phone {
      width: 46px;
      height: 76px;
      border: 3px solid #4cc9ff;
      border-radius: 9px;
      animation: tilt 2.2s ease-in-out infinite;
    }

    #rotate p {
      margin: 0;
      font-size: 14px;
      letter-spacing: 4px;
      color: #7f93ad;
    }
  }

  @keyframes tilt {
    0%,
    40% {
      transform: rotate(0deg);
    }
    60%,
    100% {
      transform: rotate(-90deg);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #rotate .phone {
      animation: none;
      transform: rotate(-90deg);
    }
  }

  noscript {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    color: #e8f4ff;
    background: #05060d;
    text-align: center;
    padding: 24px;
  }
</style>

<canvas id="game"></canvas>

<div id="boot">
  <div class="mark"></div>
  <div>LOADING</div>
</div>

<div id="rotate">
  <div class="phone"></div>
  <p>ROTATE YOUR DEVICE</p>
</div>

<noscript>
  <p>Neon Depths runs entirely in the browser and needs JavaScript enabled.</p>
</noscript>

<script type="module" src="/src/main.ts"></script>
