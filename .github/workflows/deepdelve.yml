name: DeepDelve

# Scoped by path: the two games in this repository are independent projects with
# separate dependency trees, and a change to one has no bearing on the other.
on:
  push:
    branches: [main]
    paths:
      - 'deepdelve/**'
      - '.github/workflows/deepdelve.yml'
  pull_request:
    paths:
      - 'deepdelve/**'
      - '.github/workflows/deepdelve.yml'

concurrency:
  group: deepdelve-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: deepdelve

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deepdelve/package-lock.json

      - run: npm ci

      # Each step runs even when an earlier one fails, so a contributor sees
      # every problem in one CI round rather than one per push.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build

      # The bundle is the product on a game portal: it is downloaded before
      # anything is playable, over connections the player did not choose. A
      # regression here is a retention problem, so it fails the build rather
      # than being noticed later.
      - name: Bundle budget
        if: ${{ !cancelled() }}
        run: |
          BYTES=$(cat dist/assets/*.js dist/assets/*.css | gzip -9 | wc -c)
          LIMIT=$((150 * 1024))
          echo "gzipped bundle: $BYTES bytes (limit $LIMIT)"
          test "$BYTES" -le "$LIMIT"
