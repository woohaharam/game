name: CI

on:
  # Only `main` runs on push. Every other branch is covered by its pull
  # request — triggering on both would run the whole matrix twice for each PR,
  # burning minutes and putting two identical result sets on one commit.
  push:
    branches: [main]
  pull_request:

# One run per pull request (or per branch, for pushes to main). Superseded runs
# are cancelled: a review only ever cares about the current head.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Run each check even when an earlier one fails, so a contributor sees
      # every problem in one CI round instead of one per push.
      - name: Formatting
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from package.json engines, plus current LTS.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm test

  build:
    name: Build & size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx vite build

      - name: Check bundle size budget
        # The game ships one self-contained bundle with no art or audio assets,
        # so a jump in size means something was pulled in by accident. The
        # budget is roughly 3x the current build — loose enough not to nag,
        # tight enough to catch an errant dependency.
        run: |
          set -euo pipefail
          bytes=$(cat dist/assets/*.js | wc -c)
          gzipped=$(cat dist/assets/*.js | gzip -9 | wc -c)
          budget=256000

          {
            echo "### Bundle size"
            echo ""
            echo "| Metric | Size | Budget |"
            echo "| --- | ---: | ---: |"
            echo "| Raw | $((bytes / 1024)) KB | $((budget / 1024)) KB |"
            echo "| Gzipped | $((gzipped / 1024)) KB | — |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$bytes" -gt "$budget" ]; then
            echo "::error::Bundle is ${bytes} bytes, over the ${budget} byte budget"
            exit 1
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
