name: CI

on:
  # Only `main` runs on push. Every other branch is covered by its pull
  # request — triggering on both would run the whole matrix twice for each PR,
  # burning minutes and putting two identical result sets on one commit.
  push:
    branches: [main]
  pull_request:

# One run per pull request (or per branch, for pushes to main). Superseded runs
# are cancelled: a review only ever cares about the current head.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Run each check even when an earlier one fails, so a contributor sees
      # every problem in one CI round instead of one per push.
      - name: Formatting
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from package.json engines, plus current LTS.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm test

  build:
    name: Build & size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      # The bundle is the product on a game portal: it is downloaded before
      # anything is playable, over connections the player did not choose. A
      # regression here is a retention problem, so it fails the build rather
      # than being noticed later.
      - name: Bundle budget
        run: |
          BYTES=$(cat dist/assets/*.js dist/assets/*.css | gzip -9 | wc -c)
          LIMIT=$((150 * 1024))
          echo "gzipped bundle: $BYTES bytes (limit $LIMIT)"
          test "$BYTES" -le "$LIMIT"
