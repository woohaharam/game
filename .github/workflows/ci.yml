name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npx vite build

      - name: Check bundle size budget
        # The game ships as a single self-contained bundle with no art or audio
        # assets, so a sudden jump in size means something was pulled in by
        # accident. 250 KB uncompressed is roughly 3x the current build.
        run: |
          size=$(find dist/assets -name '*.js' -not -name '*.map' -exec du -cb {} + | tail -1 | cut -f1)
          echo "Bundle size: ${size} bytes"
          if [ "$size" -gt 256000 ]; then
            echo "::error::Bundle exceeded the 250 KB budget (${size} bytes)"
            exit 1
          fi
