name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue it behind the running one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The same gate as CI. Deploy re-runs it rather than trusting the CI run
      # on the merge commit: this workflow is what publishes, so it is what
      # has to be sure.
      - run: npm run verify

      - name: Build
        # A project site is served from /<repo>/, so the asset base has to
        # match or every script tag 404s.
        env:
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
        run: npx vite build

      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run instead of failing when it does
          # not exist yet, so deployment is configured by this file rather than
          # by a setting somebody has to remember to flip in the UI.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
