<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` plus `user-scalable=no`: portals embed the game in an
      iframe where a pinch-zoom is almost always an accidental double-tap on a
      buy button, and the resulting zoom cannot be undone from inside the frame.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Both are replaced at boot by the detected locale; see `setLocale`. -->
    <meta name="description" content="방치형 판타지 던전 RPG. 끝없이 내려가세요." />
    <meta name="theme-color" content="#0e0d13" />
    <title>딥델브 — 방치형 던전 RPG</title>
    <!-- Inline so the page makes no second request; portals score cold loads. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e0d13'/%3E%3Cpath d='M16 5l3.4 7.4L27 14l-5.6 5.2L22.8 27 16 23.2 9.2 27l1.4-7.8L5 14l7.6-1.6z' fill='%23f0c04a'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
